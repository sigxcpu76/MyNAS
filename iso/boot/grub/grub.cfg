set default=0
set timeout=10

# Load video drivers and font
insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm
    terminal_output gfxterm
fi

# Enable serial console redirection for IPMI / Serial-over-LAN (SOL)
insmod serial
serial --unit=0 --speed=115200
terminal_input --append serial
terminal_output --append serial

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install mynas Appliance (Standard Display)" --class debian --class gnu-linux {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}

menuentry "Install mynas Appliance (Serial Console - 115200)" --class debian --class gnu-linux {
    linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200
    initrd /live/initrd.img
}

menuentry "Rescue Shell (Live Maintenance Mode)" --class maintenance {
    linux /live/vmlinuz boot=live components single console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}

menuentry "System Reboot" {
    reboot
}

menuentry "System Shutdown" {
    halt
}
