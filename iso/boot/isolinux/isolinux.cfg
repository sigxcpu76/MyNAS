UI vesamenu.c32
PROMPT 0
TIMEOUT 100

MENU TITLE mynas Appliance Installer (BIOS Boot)
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033b5e5 #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL install
    MENU LABEL ^Install mynas Appliance (Standard Display)
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components console=ttyS0,115200 console=tty0

LABEL serial
    MENU LABEL Install mynas Appliance (^Serial Console - 115200)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components console=tty0 console=ttyS0,115200

LABEL rescue
    MENU LABEL ^Rescue Shell (Live Maintenance Mode)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components single console=ttyS0,115200 console=tty0
