<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nanBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <linearGradient id="nanAccent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="nanDrive" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#nanBg)" stroke="url(#nanAccent)" stroke-width="2.5" />

  <!-- Chassis Drive Bays -->
  <g transform="translate(8, 9)">
    <!-- Drive Bay 1 -->
    <rect x="0" y="0" width="48" height="9" rx="2.5" fill="url(#nanDrive)" stroke="#475569" stroke-width="0.75" />
    <circle cx="5" cy="4.5" r="1.5" fill="#38bdf8" />
    <circle cx="10" cy="4.5" r="1" fill="#4ade80" />
    <line x1="16" y1="4.5" x2="43" y2="4.5" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- Drive Bay 2 -->
    <rect x="0" y="12" width="48" height="9" rx="2.5" fill="url(#nanDrive)" stroke="#475569" stroke-width="0.75" />
    <circle cx="5" cy="16.5" r="1.5" fill="#818cf8" />
    <circle cx="10" cy="16.5" r="1" fill="#4ade80" />
    <line x1="16" y1="16.5" x2="43" y2="16.5" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- Drive Bay 3 -->
    <rect x="0" y="24" width="48" height="9" rx="2.5" fill="url(#nanDrive)" stroke="#475569" stroke-width="0.75" />
    <circle cx="5" cy="28.5" r="1.5" fill="#c084fc" />
    <circle cx="10" cy="28.5" r="1" fill="#4ade80" />
    <line x1="16" y1="28.5" x2="43" y2="28.5" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" />
  </g>

  <!-- Stylized "NaN" Emblem Plate at Bottom -->
  <rect x="12" y="44" width="40" height="14" rx="4" fill="#0f172a" stroke="url(#nanAccent)" stroke-width="1.2" />
  <text x="32" y="54.5" fill="url(#nanAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle" letter-spacing="1">NaN</text>
</svg>
