syntax = "proto3";

package nas.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/sigxcpu/nas/internal/gen/nas/v1;nasv1";

// =============================================================================
// LXC Container Resource
// =============================================================================

message LxcMountPoint {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

message LxcContainer {
  option (google.api.resource) = {
    type: "nas.sigxcpu.io/LxcContainer"
    pattern: "lxcContainers/{lxc_container}"
    singular: "lxcContainer"
    plural: "lxcContainers"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string container_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string state = 3 [(google.api.field_behavior) = OUTPUT_ONLY]; // RUNNING, STOPPED, FROZEN
  string distribution = 4; // debian, ubuntu, alpine, archlinux
  string release = 5; // bookworm, noble, 3.20, current
  string architecture = 6; // amd64, arm64
  string ipv4_address = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool autostart = 8;
  bool unprivileged = 9;
  string rootfs_path = 10;
  int64 memory_limit_mib = 11;
  int32 cpu_cores = 12;
  string template_archive = 13; // Template archive (.tar.gz / .tar.xz) in this pool or another pool
  repeated LxcMountPoint mount_points = 14;
  bool gpu_enabled = 15;
  string description = 16;
  string network_bridge = 17;
  double cpu_percent = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 memory_used_mib = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListLxcContainersRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
}

message ListLxcContainersResponse {
  repeated LxcContainer lxc_containers = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
}

message CreateLxcContainerRequest {
  string lxc_container_id = 1 [(google.api.field_behavior) = REQUIRED];
  LxcContainer lxc_container = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
  bool force = 2;
}

message StartLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
}

message StopLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
}

message FreezeLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
}

message RestartLxcContainerRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
}

message UpdateLxcContainerRequest {
  LxcContainer lxc_container = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

message GetLxcContainerLogsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/LxcContainer"}
  ];
  int32 tail = 2;
}

message GetLxcContainerLogsResponse {
  string logs = 1;
  int32 line_count = 2;
}

// =============================================================================
// LXC Application & Template Catalog (Community-Scripts, TurnKey, LinuxContainers)
// =============================================================================

message LxcCatalogItem {
  string id = 1;
  string title = 2;
  string description = 3;
  string source = 4; // "community-scripts", "turnkey", "linuxcontainers"
  string category = 5;
  repeated string categories = 6;
  string icon_url = 7;
  string website = 8;
  string documentation_url = 9;
  string base_distribution = 10;
  string base_release = 11;
  string architecture = 12;
  int32 default_cpu_cores = 13;
  int64 default_memory_limit_mib = 14;
  int32 default_port = 15;
  string download_url = 16;
  string install_script_url = 17;
  string install_recipe = 18;
  bool privileged_required = 19;
  repeated string recommended_mounts = 20;
  bool gpu_recommended = 21;
}

message ListLxcCatalogItemsRequest {
  string source = 1; // "all", "community-scripts", "turnkey", "linuxcontainers"
  string category = 2;
  string query = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListLxcCatalogItemsResponse {
  repeated LxcCatalogItem items = 1;
  int32 total_size = 2;
  string last_sync_time = 3;
}

message GetLxcCatalogItemRequest {
  string id = 1;
}

message SyncLxcCatalogRequest {
  bool force = 1;
}

message SyncLxcCatalogResponse {
  bool success = 1;
  string message = 2;
  int32 total_items = 3;
  string last_sync_time = 4;
}

