// =============================================================================
// Auth Messages
// =============================================================================

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

message LoginResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  User user = 4;
}

message GetCurrentUserRequest {}

// =============================================================================
// Prerequisite Resource
// =============================================================================

message Prerequisite {
  option (google.api.resource) = {
    type: "nas.sigxcpu.io/Prerequisite"
    pattern: "prerequisites/{prerequisite}"
    singular: "prerequisite"
    plural: "prerequisites"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string display_name = 2;
  string category = 3; // STORAGE, VIRTUALIZATION, CONTAINERS, SHARING, SECURITY
  string kind = 4; // BINARY, LIBRARY, KERNEL_MODULE, DAEMON
  string binary_or_path = 5;
  string status = 6; // INSTALLED, MISSING, DEGRADED, FALLBACK_ACTIVE
  string version = 7;
  string details = 8;
  string install_hint = 9;
  repeated string required_by = 10;
  bool fallback_mode = 11;
  google.protobuf.Timestamp checked_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListPrerequisitesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string filter = 3;
}

message ListPrerequisitesResponse {
  repeated Prerequisite prerequisites = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetPrerequisiteRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "nas.sigxcpu.io/Prerequisite"}
  ];
}

message CheckPrerequisitesRequest {}

message CheckPrerequisitesResponse {
  repeated Prerequisite prerequisites = 1;
  int32 installed_count = 2;
  int32 missing_count = 3;
  bool hybrid_fallback_enabled = 4;
}

// =============================================================================
// Disk & Storage Hardware Resources
// =============================================================================

message DiskPartition {
  string name = 1;
  string device_path = 2;
  int64 size_bytes = 3;
  string fstype = 4;
  string mountpoint = 5;
  string label = 6;
  string owning_zfs_pool = 7;
}

message Disk {
  option (google.api.resource) = {
    type: "nas.sigxcpu.io/Disk"
    pattern: "disks/{disk}"
    singular: "disk"
    plural: "disks"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER]; // "disks/nvme0n1"
  string disk_id = 2; // "nvme0n1"
  string device_path = 3; // "/dev/nvme0n1"
  int64 size_bytes = 4;
  string model = 5;
  string serial = 6;
  string vendor = 7;
  string transport = 8; // "nvme", "sata", "sas", "usb", "virtio"
  bool rotational = 9;
  string type = 10; // "NVME", "SSD", "HDD", "VIRTUAL"
