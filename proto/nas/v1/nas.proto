      post: "/v1/{name=dockerApps/*}:stop"
      body: "*"
    };
  }

  rpc RestartDockerApp(RestartDockerAppRequest) returns (DockerApp) {
    option (google.api.http) = {
      post: "/v1/{name=dockerApps/*}:restart"
      body: "*"
    };
  }

  rpc GetDockerAppLogs(GetDockerAppLogsRequest) returns (GetDockerAppLogsResponse) {
    option (google.api.http) = {
      get: "/v1/{name=dockerApps/*}:logs"
    };
  }

  // ---------------------------------------------------------------------------
  // Docker Storage & Apps Pool Configuration
  // ---------------------------------------------------------------------------

  rpc GetDockerConfig(GetDockerConfigRequest) returns (DockerConfig) {
    option (google.api.http) = {
