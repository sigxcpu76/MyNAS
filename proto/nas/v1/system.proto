syntax = "proto3";

package nas.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/sigxcpu/nas/internal/gen/nas/v1;nasv1";

// =============================================================================
// System Configuration & Main Pool Messages
// =============================================================================

message DiscoveredPool {
  string pool_name = 1;
  bool has_nas_system = 2;
  string config_version = 3;
  string last_modified = 4;
  bool is_imported = 5;
  string dataset_path = 6;
  string mountpoint = 7;
}

message SystemConfig {
  string main_pool = 1;
  string system_dataset = 2;
  string system_mountpoint = 3;
  bool is_initialized = 4;
  repeated string enabled_modules = 5;
  string config_file_path = 6;
  bool auto_discover = 7;
  repeated DiscoveredPool discovered_pools = 8;
}

message GetSystemConfigRequest {}

message UpdateSystemConfigRequest {
  SystemConfig system_config = 1 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.FieldMask update_mask = 2;
}

message SelectMainPoolRequest {
  string pool_name = 1 [(google.api.field_behavior) = REQUIRED];
  bool auto_import_existing = 2;
}

message DiscoverPoolsRequest {}

message DiscoverPoolsResponse {
  repeated DiscoveredPool pools = 1;
}

// =============================================================================
// Real-Time System Telemetry & Hardware Metadata
// =============================================================================

message CpuTelemetry {
  string model = 1;
  int32 physical_cores = 2;
  int32 logical_cores = 3;
  double usage_percent = 4;
  double load1 = 5;
  double load5 = 6;
  double load15 = 7;
  double temperature_celsius = 8;
  repeated double core_temperatures = 9;
  repeated double package_temperatures = 10;
}

message MemoryTelemetry {
  int64 total_bytes = 1;
  int64 free_bytes = 2;
  int64 available_bytes = 3;
  int64 used_bytes = 4;
  int64 zfs_arc_bytes = 5;
  int64 zfs_arc_max_bytes = 6;
  int64 buffers_bytes = 7;
  int64 cached_bytes = 8;
  int64 services_bytes = 9;
}

message HostHardwareInfo {
  string hostname = 1;
  string os_name = 2;
  string os_version = 3;
  string kernel_version = 4;
  string architecture = 5;
  int64 uptime_seconds = 6;
  string motherboard_vendor = 7;
  string motherboard_name = 8;
  string motherboard_version = 9;
  string bios_vendor = 10;
  string bios_version = 11;
  string bios_date = 12;
  repeated string gpus = 13;
}

message NetworkInterfaceTelemetry {
  string name = 1;
  repeated string ip_addresses = 2;
  string mac_address = 3;
  bool is_up = 4;
  int64 speed_mbps = 5;
  int64 rx_bytes = 6;
  int64 tx_bytes = 7;
  int64 rx_rate_bytes_per_sec = 8;
  int64 tx_rate_bytes_per_sec = 9;
  bool is_default = 10;
  bool is_bridge = 11;
}

message GpuTelemetry {
  int32 index = 1;
  string name = 2;
  string driver_version = 3;
  double temperature_celsius = 4;
  double utilization_percent = 5;
  int64 memory_used_bytes = 6;
  int64 memory_total_bytes = 7;
  double power_watts = 8;
  double power_cap_watts = 9;
  int32 fan_speed_percent = 10;
  string vendor = 11;
}

message PowerMeterTelemetry {
  string device_name = 1;
  string adapter = 2;
  double power_watts = 3;
  double interval_seconds = 4;
}

message HardwareSensorItem {
  string chip = 1;
  string adapter = 2;
  string label = 3;
  string category = 4; // "CPU", "GPU", "PCI", "STORAGE", "MOTHERBOARD", "FAN", "POWER", "SYSTEM"
  double current_value = 5;
  string unit = 6;     // "°C", "RPM", "W", "V", "%"
  double high_threshold = 7;
  double crit_threshold = 8;
  bool alarm = 9;
}

message HardwareSensorsTelemetry {
  bool lm_sensors_installed = 1;
  PowerMeterTelemetry power_meter = 2;
  repeated GpuTelemetry gpus = 3;
  repeated HardwareSensorItem temperatures = 4;
  repeated HardwareSensorItem fans = 5;
}

message SystemTelemetry {
  CpuTelemetry cpu = 1;
  MemoryTelemetry memory = 2;
  HostHardwareInfo host = 3;
  repeated NetworkInterfaceTelemetry network = 4;
  HardwareSensorsTelemetry sensors = 5;
}

message GetSystemTelemetryRequest {}

// =============================================================================
// Telemetry & Multiplexed Resource Streaming
// =============================================================================

message StreamSystemTelemetryRequest {
  int32 interval_seconds = 1;
}

message WatchResourcesRequest {
  repeated string resource_types = 1; // e.g. ["dockerApps", "dockerContainers", "virtualMachines", "lxcContainers", "telemetry"]
}

message WatchResourceChange {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    SNAPSHOT = 1;
    ADDED = 2;
    MODIFIED = 3;
    DELETED = 4;
  }
  string resource_type = 1; // "dockerApps", "dockerContainers", "virtualMachines", "lxcContainers", "telemetry"
  EventType event_type = 2;
  string resource_name = 3; // e.g. "dockerApps/nextcloud"
  string json_payload = 4;   // JSON payload of the entity or initial array
}

// =============================================================================
// OTA System Binary Update Messages
// =============================================================================

message CheckSystemUpdateRequest {
  bool force_refresh = 1;
  string target_version = 2;
}

message CheckSystemUpdateResponse {
  string current_version = 1;
  string latest_version = 2;
  bool update_available = 3;
  string release_url = 4;
  string release_notes = 5;
  string published_at = 6;
  string download_url = 7;
  int64 binary_size_bytes = 8;
  string expected_sha256 = 9;
  string current_commit = 10;
  string current_build_date = 11;
  string binary_path = 12;
}

message ApplySystemUpdateRequest {
  string target_version = 1;
  bool restart_service = 2;
}

message ApplySystemUpdateResponse {
  bool success = 1;
  string message = 2;
  string updated_version = 3;
  string previous_version = 4;
  bool service_restarting = 5;
}


