syntax = "proto3";

package nas.v1;

option go_package = "github.com/sigxcpu/nas/internal/gen/nas/v1;nasv1";

// =============================================================================
// Application Catalog Messages (TrueNAS SCALE Catalog)
// =============================================================================

message CatalogApp {
  string app_id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  repeated string categories = 5;
  string icon_url = 6;
  string home = 7;
  string train = 8;
  string version = 9;
  string app_version = 10;
  repeated string tags = 11;
  repeated string screenshots = 12;
  string compose_yaml = 13;
  int32 default_port = 14;
  repeated string sources = 15;
  string container_image = 16;
  repeated CatalogQuestionGroup question_groups = 17;
  repeated CatalogQuestion questions = 18;
}

message CatalogQuestion {
  string variable = 1;
  string label = 2;
  string description = 3;
  string type = 4;
  string default_value = 5;
  bool required = 6;
  string group = 7;
  repeated string options = 8;
  string mount_path = 9;
}

message CatalogQuestionGroup {
  string name = 1;
  string description = 2;
  repeated CatalogQuestion questions = 3;
}

message ListCatalogAppsRequest {
  string train = 1;
  string category = 2;
  string query = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListCatalogAppsResponse {
  repeated CatalogApp apps = 1;
  int32 total_size = 2;
  string last_sync_time = 3;
}

message GetCatalogAppRequest {
  string app_id = 1;
  string train = 2;
}

message SyncCatalogRequest {
  bool force = 1;
}

message SyncCatalogResponse {
  bool success = 1;
  string message = 2;
  int32 total_apps = 3;
  string last_sync_time = 4;
}
