name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage APK Release Asset
        run: |
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifact/NaN-NAS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nan-nas-apk
          path: apk-artifact/NaN-NAS.apk
          retention-days: 1

  build-binaries:
    name: Build Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [build-apk]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: nan-nas-apk
          path: apk-dl

      - name: Sync APK into Web Bundle
        run: |
          mkdir -p web/public
          cp -f apk-dl/NaN-NAS.apk web/public/nan-nas.apk

      - name: Install System Build Dependencies (PAM & Crypt)
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libcrypt-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Compile Single Embedded Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goarch == 'amd64' && '1' || '0' }}
        run: |
          mkdir -p dist
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          OUTPUT_NAME="nasctl-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X 'github.com/sigxcpu/nas/internal/version.Version=${TAG_NAME}' -X 'github.com/sigxcpu/nas/internal/version.GitCommit=${{ github.sha }}' -X 'github.com/sigxcpu/nas/internal/version.BuildDate=${BUILD_DATE}'"
          go build -v -ldflags="${LDFLAGS}" -o "dist/${OUTPUT_NAME}" ./cmd/nasctl
          objcopy --remove-section .note.gnu.property "dist/${OUTPUT_NAME}" 2>/dev/null || true
          chmod +x "dist/${OUTPUT_NAME}"
          cd dist
          sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256"
          tar -czf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"
          sha256sum "${OUTPUT_NAME}.tar.gz" > "${OUTPUT_NAME}.tar.gz.sha256"

      - name: Generate Debian Package
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          OUTPUT_NAME="nasctl-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          chmod +x packaging/deb/build.sh
          ./packaging/deb/build.sh "dist/${OUTPUT_NAME}" "${TAG_NAME}" "${{ matrix.goarch }}" dist

      - name: Upload Binary and Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
            dist/nasctl-*
          retention-days: 1

  build-iso:
    name: Build Appliance ISO
    needs: [build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: nan-nas-apk
          path: apk-dl

      - name: Sync APK into Web Bundle
        run: |
          mkdir -p web/public
          cp -f apk-dl/NaN-NAS.apk web/public/nan-nas.apk

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Install System Build Dependencies (PAM & Crypt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libcrypt-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Compile Standalone nasctl Binary
        env:
          CGO_ENABLED: 1
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X 'github.com/sigxcpu/nas/internal/version.Version=${TAG_NAME}' -X 'github.com/sigxcpu/nas/internal/version.GitCommit=${{ github.sha }}' -X 'github.com/sigxcpu/nas/internal/version.BuildDate=${BUILD_DATE}'"
          mkdir -p bin
          go build -v -ldflags="${LDFLAGS}" -o bin/nasctl ./cmd/nasctl

      - name: Build Appliance ISO via Docker Builder
        run: |
          make -C iso iso COMP=lz4

      - name: Prepare ISO Release Assets
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          mkdir -p release-iso
          ISO_NAME="nan-appliance-${TAG_NAME}-amd64.iso"
          cp iso/output/nan-appliance-amd64.iso "release-iso/${ISO_NAME}"
          cd release-iso
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appliance-iso
          path: release-iso/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-iso, build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag || github.ref_name }} --latest --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Changelog and Checksums to Release Assets
        run: |
          cp release-notes.md release-assets/CHANGELOG.md
          cd release-assets
          find . -maxdepth 1 -type f ! -name "*.sha256" ! -name "CHANGELOG.md" ! -name "checksums.txt" -exec sha256sum {} + > checksums.txt

      - name: List Release Assets
        run: |
          ls -la release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
