name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies (PAM & Crypt)
        if: matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libcrypt-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Compile Single Embedded Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goarch == 'amd64' && '1' || '0' }}
        run: |
          mkdir -p dist
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          OUTPUT_NAME="nasctl-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -v -ldflags="-s -w -X main.version=${TAG_NAME}" -o "dist/${OUTPUT_NAME}" ./cmd/nasctl
          chmod +x "dist/${OUTPUT_NAME}"
          tar -czf "dist/${OUTPUT_NAME}.tar.gz" -C dist "${OUTPUT_NAME}"
          cd dist && sha256sum "${OUTPUT_NAME}.tar.gz" > "${OUTPUT_NAME}.tar.gz.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/nasctl-*
          retention-days: 1

  build-iso:
    name: Build Appliance ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Install System Build Dependencies (PAM & Crypt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libcrypt-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Build Bundle
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Compile Standalone nasctl Binary
        env:
          CGO_ENABLED: 1
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          mkdir -p bin
          go build -v -ldflags="-s -w -X main.version=${TAG_NAME}" -o bin/nasctl ./cmd/nasctl

      - name: Build Appliance ISO via Docker Builder
        run: |
          make -C iso iso COMP=lz4

      - name: Prepare ISO Release Assets
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          mkdir -p release-iso
          ISO_NAME="mynas-appliance-${TAG_NAME}-amd64.iso"
          cp iso/output/mynas-appliance-amd64.iso "release-iso/${ISO_NAME}"
          cd release-iso
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appliance-iso
          path: release-iso/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-binaries, build-iso]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --tag ${{ inputs.tag || github.ref_name }} --latest --strip header
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Changelog to Release Assets
        run: |
          cp release-notes.md release-assets/CHANGELOG.md

      - name: List Release Assets
        run: |
          ls -la release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
